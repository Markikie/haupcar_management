services:
  postgres:
    image: postgres:16
    container_name: haupcar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: haupcar
      POSTGRES_PASSWORD: car_password
      POSTGRES_DB: haupcar
    ports:
      - "5432:5432"
    volumes:
      - haupcar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haupcar -d haupcar"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
    container_name: haupcar-backend
    restart: unless-stopped
    environment:
        PORT: 3000
        DATABASE_URL: "postgresql://haupcar:car_password@postgres:5432/haupcar?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:3000/api/v1"
    container_name: haupcar-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  haupcar_postgres_data:
